openapi: 3.1.0
info:
  title: NeNe Sample REST API
  version: 0.1.0
  description: |
    OpenAPI contract for the current NeNe sample REST endpoints.
    The YAML file under `docs/api/` is the source of truth for API documentation.
servers:
  - url: http://localhost:8080
    description: Local Docker development server
tags:
  - name: Health
    description: Installation and runtime health checks.
  - name: Session
    description: Session authentication endpoints.
  - name: TODO
    description: Authenticated TODO sample endpoints.
paths:
  /health/index:
    get:
      tags:
        - Health
      summary: Check API, database, and sample schema health
      operationId: healthCheck
      responses:
        "200":
          description: Health result. A degraded result still uses 200 so installers can inspect setup state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthSuccessEnvelope"
              examples:
                ok:
                  value:
                    Result: true
                    Data:
                      status: success
                      errorCode: ""
                      healthStatus: ok
                      api: true
                      database: true
                      schema: true
                      databaseType: MySQL
                degraded:
                  value:
                    Result: true
                    Data:
                      status: success
                      errorCode: ""
                      healthStatus: degraded
                      api: true
                      database: false
                      schema: false
                      databaseType: MySQL
  /session/login:
    post:
      tags:
        - Session
      summary: Sign in to the sample application
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              default:
                value:
                  user_id: admin
                  user_pass: admin
      responses:
        "200":
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessEnvelope"
              examples:
                success:
                  value:
                    Result: true
                    Data:
                      status: success
                      errorCode: ""
                      csrfToken: sample-csrf-token
                      user:
                        id: 1
                        user_id: admin
        "401":
          description: Credentials were rejected (`LOGIN-FAILED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailureEnvelope"
              examples:
                failure:
                  value:
                    Result: true
                    Data:
                      status: failure
                      errorCode: LOGIN-FAILED
                      errorMessage: Wrong user ID or user PASS
  /session/logout:
    post:
      tags:
        - Session
      summary: Sign out from the sample application
      operationId: logout
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        "200":
          description: Logout completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BasicSuccessEnvelope"
        "403":
          $ref: "#/components/responses/CsrfTokenInvalid"
  /todo/index:
    get:
      tags:
        - TODO
      summary: List TODO items for the signed-in user
      operationId: listTodos
      security:
        - sessionCookie: []
      responses:
        "200":
          description: TODO list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoListSuccessEnvelope"
        "401":
          $ref: "#/components/responses/SessionClosed"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags:
        - TODO
      summary: Create a TODO item for the signed-in user
      operationId: createTodo
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoCreateRequest"
            examples:
              default:
                value:
                  title: Write OpenAPI docs
      responses:
        "200":
          description: TODO created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoSuccessEnvelope"
        "401":
          $ref: "#/components/responses/SessionClosed"
        "400":
          description: TODO title was missing (`TODO-TITLE-REQUIRED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailureEnvelope"
              examples:
                titleRequired:
                  value:
                    Result: true
                    Data:
                      status: failure
                      errorCode: TODO-TITLE-REQUIRED
                      errorMessage: TODO title is required.
        "403":
          $ref: "#/components/responses/CsrfTokenInvalid"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /todo/item/id_{id}:
    put:
      tags:
        - TODO
      summary: Update a TODO item for the signed-in user
      operationId: updateTodo
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TodoUpdateRequest"
            examples:
              completion:
                value:
                  is_completed: true
              rename:
                value:
                  title: Review OpenAPI docs
      responses:
        "200":
          description: TODO updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoSuccessEnvelope"
        "401":
          $ref: "#/components/responses/SessionClosed"
        "400":
          description: TODO id or title was invalid (`TODO-ID-REQUIRED` / `TODO-TITLE-REQUIRED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailureEnvelope"
              examples:
                idRequired:
                  value:
                    Result: true
                    Data:
                      status: failure
                      errorCode: TODO-ID-REQUIRED
                      errorMessage: TODO id is required.
                titleRequired:
                  value:
                    Result: true
                    Data:
                      status: failure
                      errorCode: TODO-TITLE-REQUIRED
                      errorMessage: TODO title is required.
        "404":
          $ref: "#/components/responses/TodoNotFound"
        "403":
          $ref: "#/components/responses/CsrfTokenInvalid"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    delete:
      tags:
        - TODO
      summary: Delete a TODO item for the signed-in user
      operationId: deleteTodo
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/TodoId"
      responses:
        "200":
          description: TODO deleted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodoDeleteSuccessEnvelope"
        "401":
          $ref: "#/components/responses/SessionClosed"
        "400":
          description: TODO id was missing or invalid (`TODO-ID-REQUIRED`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiFailureEnvelope"
              examples:
                idRequired:
                  value:
                    Result: true
                    Data:
                      status: failure
                      errorCode: TODO-ID-REQUIRED
                      errorMessage: TODO id is required.
        "404":
          $ref: "#/components/responses/TodoNotFound"
        "403":
          $ref: "#/components/responses/CsrfTokenInvalid"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: PHPSESSID
      description: PHP session cookie created by `/session/login`.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: CSRF token returned by `/session/login` as `Data.csrfToken`.
  parameters:
    TodoId:
      name: id
      in: path
      required: true
      description: TODO id encoded in NeNe URL parameter format.
      schema:
        type: integer
        minimum: 1
  responses:
    SessionClosed:
      description: Session is missing or expired (`SESSION-CLOSED`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailureEnvelope"
          examples:
            sessionClosed:
              value:
                Result: true
                Data:
                  status: failure
                  errorCode: SESSION-CLOSED
                  errorMessage: Session timeout. Please log in again.
    CsrfTokenInvalid:
      description: CSRF token was missing or invalid (`CSRF-TOKEN-INVALID`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailureEnvelope"
          examples:
            csrfTokenInvalid:
              value:
                Result: true
                Data:
                  status: failure
                  errorCode: CSRF-TOKEN-INVALID
                  errorMessage: Invalid CSRF token.
    TodoNotFound:
      description: TODO item was not found for the signed-in user (`TODO-NOT-FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailureEnvelope"
          examples:
            notFound:
              value:
                Result: true
                Data:
                  status: failure
                  errorCode: TODO-NOT-FOUND
                  errorMessage: TODO item was not found.
    MethodNotAllowed:
      description: HTTP method is not allowed for this endpoint (`METHOD-NOT-ALLOWED`).
      headers:
        Allow:
          description: Comma-separated allowed HTTP methods.
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailureEnvelope"
          examples:
            methodNotAllowed:
              value:
                Result: true
                Data:
                  status: failure
                  errorCode: METHOD-NOT-ALLOWED
                  errorMessage: The HTTP method is not allowed for this endpoint.
    NotFound:
      description: |
        Route resolves to no controller or no action. The framework returns
        this JSON envelope only when the request's `Accept` header prefers
        `application/json`; otherwise the static `404.html` page is returned
        (`NOT-FOUND`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailureEnvelope"
          examples:
            notFound:
              value:
                Result: true
                Data:
                  status: failure
                  errorCode: NOT-FOUND
                  errorMessage: The requested resource was not found.
  schemas:
    JsonEnvelope:
      type: object
      required:
        - Result
        - Data
      properties:
        Result:
          type: boolean
          const: true
        Data:
          type: object
    ApiSuccessData:
      type: object
      required:
        - status
        - errorCode
      properties:
        status:
          type: string
          const: success
        errorCode:
          type: string
          const: ""
    ApiFailureData:
      type: object
      required:
        - status
        - errorCode
        - errorMessage
      properties:
        status:
          type: string
          const: failure
        errorCode:
          type: string
        errorMessage:
          type: string
    BasicSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/JsonEnvelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/ApiSuccessData"
    HealthStatus:
      allOf:
        - $ref: "#/components/schemas/ApiSuccessData"
        - type: object
          required:
            - api
            - database
            - schema
            - databaseType
            - healthStatus
          properties:
            healthStatus:
              type: string
              enum:
                - ok
                - degraded
            api:
              type: boolean
            database:
              type: boolean
            schema:
              type: boolean
            databaseType:
              type: string
              enum:
                - MySQL
                - SQLite3
            detail:
              type: string
              description: Debug-only diagnostic detail when APP_DEBUG is enabled.
    HealthSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/JsonEnvelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/HealthStatus"
    LoginRequest:
      type: object
      required:
        - user_id
        - user_pass
      properties:
        user_id:
          type: string
        user_pass:
          type: string
          format: password
    LoginUser:
      type: object
      required:
        - id
        - user_id
      properties:
        id:
          type: integer
        user_id:
          type: string
    LoginSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/JsonEnvelope"
        - type: object
          properties:
            Data:
              allOf:
                - $ref: "#/components/schemas/ApiSuccessData"
                - type: object
                  required:
                    - user
                    - csrfToken
                  properties:
                    user:
                      $ref: "#/components/schemas/LoginUser"
                    csrfToken:
                      type: string
    Todo:
      type: object
      required:
        - id
        - user_id
        - title
        - is_completed
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        user_id:
          type: integer
        title:
          type: string
        is_completed:
          type: boolean
        created_at:
          type: string
          description: Database timestamp string.
        updated_at:
          type: string
          description: Database timestamp string.
    TodoCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
    TodoUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        is_completed:
          type: boolean
    TodoListSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/JsonEnvelope"
        - type: object
          properties:
            Data:
              allOf:
                - $ref: "#/components/schemas/ApiSuccessData"
                - type: object
                  required:
                    - todos
                  properties:
                    todos:
                      type: array
                      items:
                        $ref: "#/components/schemas/Todo"
    TodoSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/JsonEnvelope"
        - type: object
          properties:
            Data:
              allOf:
                - $ref: "#/components/schemas/ApiSuccessData"
                - type: object
                  required:
                    - todo
                  properties:
                    todo:
                      $ref: "#/components/schemas/Todo"
    TodoDeleteSuccessEnvelope:
      allOf:
        - $ref: "#/components/schemas/JsonEnvelope"
        - type: object
          properties:
            Data:
              allOf:
                - $ref: "#/components/schemas/ApiSuccessData"
                - type: object
                  required:
                    - id
                  properties:
                    id:
                      type: integer
    ApiFailureEnvelope:
      description: |
        Canonical failure envelope for every documented error response. The
        specific `errorCode` and `errorMessage` values are not constrained
        here; the catalog lives at `docs/development/error-codes.md`, and
        each operation may include an `example` showing the code it returns.
      allOf:
        - $ref: "#/components/schemas/JsonEnvelope"
        - type: object
          properties:
            Data:
              $ref: "#/components/schemas/ApiFailureData"
