name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      # Dependency-vulnerability gate. Kept as its own step rather than folded into
      # `composer check`, so the job log (and any cross-repo tooling that reads it)
      # can tell whether the audit ran at all. A check that leaves no trace cannot be
      # distinguished from a check that is missing.
      - name: composer audit
        run: composer audit --no-interaction

      - name: Validate Composer metadata
        run: composer validate

      - name: Run unit tests
        run: composer test

      - name: Confirm HTTP tests skip without runtime
        run: composer test:http

      # Static analysis + formatting check were defined in composer.json
      # (`composer check`) but historically never wired into CI; #403 plugged
      # the gap so baseline regressions surface on every PR.
      - name: Run static analysis (Phan)
        run: composer analyze

      - name: Check code formatting
        run: composer format:check

  runtime-smoke:
    name: HTTP runtime smoke (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # buildx + gha cache so the second-and-later runs reuse the composer
      # install / apt layers instead of rebuilding from scratch (#403).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare environment
        run: cp .env.example .env

      - name: Ensure shared composer cache volume exists
        # compose.yaml references `nene_composer_cache` as an external
        # named volume so every NeNe checkout / FT clone shares it. On
        # a fresh CI runner the volume does not exist yet — create it
        # idempotently. (Local devs get this via tools/nene-ft-new.sh.)
        run: docker volume create nene_composer_cache

      - name: Build app image with layer cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nene-app:ci
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app

      - name: Tag image for docker compose
        # `docker compose build` would otherwise rebuild — pre-tag the buildx
        # output so the running container reuses the cached image.
        run: docker tag nene-app:ci nene-app

      - name: Start app
        # Retry: `docker compose up` pulls dependency images (mysql, redis) from
        # Docker Hub, which intermittently fails with a transient registry error
        # ("Head .../manifests/...: unknown"). Retry a few times before failing
        # the job so a Hub blip doesn't force a manual re-run.
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d app; then
              exit 0
            fi
            echo "compose up failed (attempt ${attempt}/3) — retrying in 15s…"
            sleep 15
          done
          echo "compose up failed after 3 attempts" >&2
          exit 1

      - name: Wait for /health to report healthStatus=ok
        run: |
          # Require healthStatus=ok (not just HTTP 200), because /health returns
          # 200 even when the database is degraded — letting smoke tests run too
          # early and fail with SQLSTATE[HY000] [2002] Connection refused.
          #
          # 120s budget: the app container's init does composer install +
          # ./init.sh + apache startup, which can take 60-90s on a cold GitHub
          # Actions runner. MySQL is also still finishing its first-boot init at
          # the start of this window. Don't reduce below ~90s without checking
          # tail-end runs on actually-slow runners.
          for i in $(seq 1 120); do
            status=$(curl -fsS http://localhost:8080/health/index 2>/dev/null | jq -r '.Data.healthStatus // "unknown"')
            if [ "$status" = "ok" ]; then
              echo "App became healthy (healthStatus=ok) after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "App did not reach healthStatus=ok within 120s" >&2
          docker compose logs app | tail -100 >&2
          docker compose logs mysql | tail -50 >&2
          exit 1

      - name: Run HTTP smoke tests
        run: |
          docker compose exec -T -e NENE_HTTP_BASE_URL=http://localhost:80 app composer test:http

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs app | tail -200

      - name: Stop containers
        if: always()
        run: docker compose down -v
