services:
  app:
    build:
      context: .
    ports:
      - "${NENE_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    command: >
      sh -lc "composer install --no-interaction --prefer-dist
      && ./init.sh
      && apache2-foreground"

volumes:
  vendor:
