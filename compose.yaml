services:
  app:
    build:
      context: .
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NENE_APP_ENV: "${NENE_APP_ENV:-development}"
      NENE_APP_DEBUG: "${NENE_APP_DEBUG:-1}"
      NENE_SESSION_SECURE: "${NENE_SESSION_SECURE:-0}"
      NENE_SESSION_HTTPONLY: "${NENE_SESSION_HTTPONLY:-1}"
      NENE_SESSION_SAMESITE: "${NENE_SESSION_SAMESITE:-Lax}"
      NENE_SESSION_LIFETIME: "${NENE_SESSION_LIFETIME:-0}"
      NENE_DB_TYPE: "${NENE_DB_TYPE:-MySQL}"
      NENE_DB_HOST: "${NENE_DB_HOST:-mysql}"
      NENE_DB_PORT: "${NENE_DB_PORT:-3306}"
      NENE_DB_FILE: "${NENE_DB_FILE:-nene.db}"
      NENE_DB_NAME: "${NENE_DB_NAME:-nene}"
      NENE_DB_USER: "${NENE_DB_USER:-nene}"
      NENE_DB_PASS: "${NENE_DB_PASS:-nene}"
      NENE_SAMPLE_ADMIN_PASSWORD: "${NENE_SAMPLE_ADMIN_PASSWORD:-admin}"
      NENE_LOGOUT_URI: "${NENE_LOGOUT_URI:-/}"
      NENE_MAIL_DSN: "${NENE_MAIL_DSN:-smtp://mailpit:1025}"
      NENE_MAIL_FROM: "${NENE_MAIL_FROM:-noreply@nene.local}"
      NENE_LOG_PATH: "${NENE_LOG_PATH:-}"
      NENE_UPLOAD_MAX_FILESIZE: "${NENE_UPLOAD_MAX_FILESIZE:-}"
      NENE_POST_MAX_SIZE: "${NENE_POST_MAX_SIZE:-}"
      NENE_SECURITY_CSP: "${NENE_SECURITY_CSP:-}"
      NENE_SECURITY_FRAME_OPTIONS: "${NENE_SECURITY_FRAME_OPTIONS:-}"
      NENE_SECURITY_REFERRER_POLICY: "${NENE_SECURITY_REFERRER_POLICY:-}"
      NENE_SECURITY_HSTS: "${NENE_SECURITY_HSTS:-}"
      NENE_SECURITY_PERMISSIONS_POLICY: "${NENE_SECURITY_PERMISSIONS_POLICY:-}"
      NENE_REQUEST_ID_HEADER: "${NENE_REQUEST_ID_HEADER:-X-Request-ID}"
      NENE_REQUEST_ID_TRUST_INBOUND: "${NENE_REQUEST_ID_TRUST_INBOUND:-1}"
      NENE_AGENT_BEARER_TOKEN: "${NENE_AGENT_BEARER_TOKEN:-}"
      NENE_AGENT_BEARER_USER: "${NENE_AGENT_BEARER_USER:-admin}"
      NENE_ALLOWED_EXTERNAL_REDIRECTS: "${NENE_ALLOWED_EXTERNAL_REDIRECTS:-}"
      NENE_SESSION_DSN: "${NENE_SESSION_DSN:-redis://redis:6379}"
    ports:
      - "${NENE_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
      # Composer's package archive cache is shared across every NeNe
      # checkout / trial clone via the external `nene_composer_cache`
      # named volume. A clone's vendor/ stays per-project (composer.lock
      # may differ), but the downloaded `.zip` for each package is
      # cached once and reused by every clone. Reduces a fresh
      # `composer install` from ~30-45s to ~5s after the first run.
      # The volume is created by `tools/nene-ft-new.sh` (or by hand:
      # `docker volume create nene_composer_cache`).
      - composer-cache:/root/.composer/cache
    command: >
      sh -lc "composer install --no-interaction --prefer-dist
      && ./init.sh
      && apache2-foreground"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: "${NENE_DB_NAME:-nene}"
      MYSQL_USER: "${NENE_DB_USER:-nene}"
      MYSQL_PASSWORD: "${NENE_DB_PASS:-nene}"
      MYSQL_ROOT_PASSWORD: "${NENE_DB_ROOT_PASS:-root}"
    ports:
      - "${NENE_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    build:
      context: ./docker/phpmyadmin
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    ports:
      - "${NENE_PHPMYADMIN_PORT:-8081}:80"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${NENE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${NENE_MAILPIT_WEB_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  mysql-data:
  vendor:
  # External so every NeNe checkout / trial clone references the same
  # underlying Docker volume. See the comment on the `app` service for
  # rationale.
  composer-cache:
    external: true
    name: nene_composer_cache
